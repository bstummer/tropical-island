<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tropical Island</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #f4efe6;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.6));
        cursor: pointer;
        user-select: none;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 0.25em;
        font-size: 2.4rem;
        font-weight: 300;
        letter-spacing: 0.08em;
      }
      .overlay p {
        margin: 0.2em 0;
        opacity: 0.85;
      }
      .overlay kbd {
        font: inherit;
        padding: 0 0.35em;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 4px;
      }
      #error {
        cursor: default;
        user-select: text;
        white-space: pre-wrap;
      }
      /* An error replaces the start screen, which input.js shows whenever the pointer is free. */
      body:has(#error:not([hidden])) #start {
        display: none;
      }
      /* Frame readout (core/readout.js) and benchmark (core/benchmark.js). */
      #readout,
      #bench {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(10, 12, 14, 0.72);
        font: 12px/1.45 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre;
      }
      #readout {
        left: auto;
        right: 12px; /* clear of the benchmark panel */
        pointer-events: none;
      }
      #bench {
        max-width: calc(100vw - 48px);
        max-height: calc(100vh - 48px);
        overflow: auto;
        user-select: text;
      }
      #bench pre {
        margin: 0 0 8px;
        font: inherit;
      }
      #readout[hidden],
      #bench[hidden],
      #bench button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="start" class="overlay" hidden>
      <div>
        <h1>Tropical Island</h1>
        <p>Click to start</p>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; <kbd>Space</kbd> up &middot; <kbd>Shift</kbd> down &middot; <kbd>G</kbd> walk / fly &middot; <kbd>Esc</kbd> release mouse</p>
      </div>
    </div>
    <div id="readout" hidden></div>
    <div id="bench" hidden><pre></pre><button type="button" hidden>Copy summary</button></div>
    <div id="error" class="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
