<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tropical Island</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #f4efe6;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.6));
        cursor: pointer;
        user-select: none;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 0.25em;
        font-size: 2.4rem;
        font-weight: 300;
        letter-spacing: 0.08em;
      }
      .overlay p {
        margin: 0.2em 0;
        opacity: 0.85;
      }
      .overlay kbd {
        font: inherit;
        padding: 0 0.35em;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 4px;
      }
      #error {
        cursor: default;
        user-select: text;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="start" class="overlay" hidden>
      <div>
        <h1>Tropical Island</h1>
        <p>Click to start</p>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; <kbd>Space</kbd> up &middot; <kbd>Shift</kbd> down &middot; <kbd>Esc</kbd> release mouse</p>
      </div>
    </div>
    <div id="error" class="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
