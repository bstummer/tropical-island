# On every push to main: verify the game (tests, build, check, screenshots), then
#   - deploy dist/index.html to GitHub Pages, and
#   - update the rolling "latest" release, whose asset is always the newest build:
#     https://github.com/bstummer/tropical-island/releases/latest/download/tropical-island.html
# On a push to any other branch (a session's, say), only verify.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The deploy job fails until it is set (see its first step).
#
# Only the build job installs npm packages, and it gets a read-only token. The
# jobs that publish (Pages, release) run no third-party code from node_modules.
# They run for main only: on another branch, a push or "Run workflow" just verifies it.
name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

# One run per branch at a time. On main a newer push waits rather than cancelling
# a deploy halfway through; elsewhere it replaces the run that is no longer needed.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Pinned, not ubuntu-latest: Playwright installs system packages by Ubuntu release, so a new
    # runner image could break verify, and with it publishing, unannounced. Move up on purpose.
    # (The browser doesn't depend on it: every release gets the same Chromium build.)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall downloads Playwright's headless Chromium; install-deps adds the system libraries it needs.
      - run: npm ci
      - run: npx playwright install-deps chromium

      # The same command as locally. CI runners have no GPU, so render with SwiftShader.
      - run: npm run verify -- --gl swiftshader

      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the game for the release job
        uses: actions/upload-artifact@v7
        with:
          name: game
          path: dist/index.html
          retention-days: 1

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With Source "Deploy from a branch", GitHub also runs its own Jekyll build on every
      # push. It publishes the raw repo (source index.html, src/, CLAUDE.md) and races this deploy.
      - name: Check that Pages deploys from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type); then
            if [ "$build_type" != workflow ]; then
              echo "::error::GitHub Pages deploys from a branch, so its own Jekyll build publishes the raw repository and races this deploy. Set Settings -> Pages -> Build and deployment -> Source to \"GitHub Actions\", then re-run this workflow."
              exit 1
            fi
          else
            echo "::warning::Could not read the Pages settings; skipping the source check."
          fi

      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game

      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv index.html tropical-island.html
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          notes="Latest build of main at ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC').

          Download **tropical-island.html** below and open it in a desktop browser. It's a single file that works offline.
          Play online: ${pages_url}"

          # Point the "latest" tag at this commit (created on the first run).
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" > /dev/null

          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest tropical-island.html --clobber
            gh release edit latest --title "Latest build" --notes "$notes" --latest
          else
            gh release create latest tropical-island.html --title "Latest build" --notes "$notes" --latest
          fi
